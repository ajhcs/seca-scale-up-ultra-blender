:root{

*{margin:0;padding:0;box-sizing:border-box}
body{background:

.top h1 b{color:var(--nv);font-weight:600}
.top .meta{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--fg3)}
.top .ghlink{font-family:var(--mono);font-size:12px;color:var(--fg3);margin-left:8px;

.top .ghlink:hover{color:var(--nv);border-color:var(--nv)}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:14px 32px 8px}
.stat{background:var(--bg1);border:1px solid var(--line);border-radius:12px;

.stat.s-pass::after{background:var(--pass)} .stat.s-fail::after{background:var(--fail)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:8px 32px}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:16px}
.card[data-v="fail"]{border-left:3px solid var(--fail)}
.card[data-v="pass"]{border-left:3px solid var(--pass)}
.card[data-v="error"]{border-left:3px dashed var(--err)}
.card .chead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.verdict{display:inline-block;width:13px;height:13px;border-radius:50%;flex-shrink:0}
.v-pass{background:var(--pass)} .v-fail{background:var(--fail)} .v-error{background:var(--err)}
.v-warn{background:var(--warn)}
.fname{font-family:var(--mono);font-size:14px;font-weight:600;flex:1;line-height:1.35;overflow-wrap:anywhere}
.cdir{font-family:var(--mono);font-size:11px;color:var(--fg3);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-row{font-family:var(--mono);font-size:12px;color:var(--fg2);margin-bottom:10px}
.profile-row .pid{color:var(--nv)}
.err-note{font-family:var(--mono);font-size:12px;color:var(--err);padding:8px 0;font-style:italic}
.features{display:flex;flex-direction:column;gap:6px}
.feat{background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.feat-head{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;

.feat-head:hover{background:var(--bg3)}
.feat-head .fid{font-family:var(--mono);font-size:13px;font-weight:600;flex:1}
.feat-head .fver{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.feat-head .feat-gh{font-family:var(--mono);font-size:11px;color:var(--fg3);
  border:1px solid var(--line2);border-radius:4px;padding:1px 7px;flex-shrink:0;transition:all .12s}
.feat-head .feat-gh:hover{color:var(--nv);border-color:var(--nv)}
.feat-body{padding:10px 14px;border-top:1px solid var(--line);display:none}
.feat.open .feat-body{display:block}
.feat.open .feat-head{background:var(--bg3)}
.req-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.req-item{font-family:var(--mono);font-size:12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.req-id{color:var(--fail);font-weight:700;flex-shrink:0}
.req-id.req-opt{color:var(--warn)}
.req-msg{color:var(--fg2);flex:1}
.opt-note{font-family:var(--mono);font-size:11px;color:var(--warn);padding-bottom:6px}
.req-link{color:var(--fg3);font-size:11px;border:1px solid var(--line2);border-radius:4px;
  padding:1px 7px;white-space:nowrap;flex-shrink:0;transition:all .12s}
.req-link:hover{color:var(--nv);border-color:var(--nv)}
.all-pass{font-family:var(--mono);font-size:12px;color:var(--pass)}
.issues{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.issue{font-family:var(--mono);font-size:11px;color:var(--fg2);background:var(--bg);
  border-radius:6px;padding:6px 10px;line-height:1.6}
.issue .sev{font-weight:700;margin-right:6px}
.sev-error{color:var(--err)} .sev-warning{color:var(--warn)}
.section-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--fg3);padding:6px 0 4px}
